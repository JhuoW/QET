# M1.5 warm-up (D-010, D-025d): 5 demo-order SFT steps in the quotient renderer, then the
# checkpoint that configuration runs start from. Generated by scripts/make_m1_configs.py.
milestone: M1
name: warmup-quotient-qwen7b
configuration: '2'
seed: 2
backbone: Qwen/Qwen2.5-7B-Instruct
dtype: bfloat16
data:
  env: funcbenchgen
  kind: grid
  source:
    compile_run: results/raw/M1-compile-20261018T023058Z
    train: train
    eval: dev
  train:
    start: 0
    count: 5000
  test:
    start: 0
    count: 0
train:
  token_budget: 125000000
  warmup_steps: 5
  warmup_only: true
  k: 4
  lora_rank: 64
  lora_alpha: 128
  batch_graphs: 4
  lr: 0.0001
  warmup: 0.03
  max_grad_norm: 1.0
  s_max: 256
  max_tokens: 8192
  max_target_tokens: 8192
  checkpoint_fractions:
  - 1.0
eval:
  decoding:
  - mode: greedy
  - mode: sample
    temperature: 1.0
    top_p: 1.0
    samples: 8
  max_new_tokens: 512
  resume_prefix_tasks: 0
estimate:
  train_tokens_per_second: 7300
  eval_tokens_per_second: 1000
